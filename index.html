<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tetris Reimagined</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.3), transparent 50%);
      animation: backgroundShift 20s ease infinite;
    }

    @keyframes backgroundShift {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .wrapper {
      background: rgba(15, 15, 35, 0.95);
      backdrop-filter: blur(20px);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 100px rgba(102, 126, 234, 0.3),
        inset 0 0 50px rgba(255, 255, 255, 0.03);
      display: flex;
      gap: 24px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .game-container {
      position: relative;
    }

    canvas {
      border-radius: 16px;
      display: block;
      box-shadow: 
        0 10px 40px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 200px;
    }

    .title {
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
      text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
      letter-spacing: 2px;
    }

    .tagline {
      font-size: 11px;
      text-align: center;
      color: #9fa6ff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    .panel {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .panel:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
      border-color: rgba(102, 126, 234, 0.5);
    }

    .panel-label {
      font-size: 12px;
      color: #9fa6ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .score-value {
      font-size: 42px;
      font-weight: 900;
      text-align: center;
      margin: 12px 0;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
      animation: scoreGlow 2s ease-in-out infinite;
    }

    @keyframes scoreGlow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }

    .next-canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 140px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .next-canvas-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(102, 126, 234, 0.1), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .controls {
      font-size: 13px;
      color: #cbd5ff;
      line-height: 1.8;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      transition: all 0.2s ease;
      cursor: pointer;           /* make clickable */
      user-select: none;
    }

    .control-item:hover {
      color: #ffffff;
      transform: translateX(4px);
    }

    .control-item:active {
      transform: translateX(4px) scale(0.97);
      opacity: 0.9;
    }

    .key-icon {
      display: inline-block;
      background: rgba(102, 126, 234, 0.2);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      border: 1px solid rgba(102, 126, 234, 0.3);
      min-width: 24px;
      text-align: center;
    }

    .game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      border-radius: 24px;
      z-index: 100;
    }

    .game-over-overlay.visible {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .game-over-content {
      text-align: center;
      padding: 48px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
      border: 2px solid #ff3b6b;
      border-radius: 24px;
      box-shadow: 
        0 20px 60px rgba(255, 59, 107, 0.4),
        inset 0 0 40px rgba(255, 59, 107, 0.1);
      animation: scaleIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .game-over-title {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff3b6b 0%, #ff8e53 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      text-shadow: 0 0 40px rgba(255, 59, 107, 0.6);
      letter-spacing: 3px;
    }

    .game-over-score {
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .game-over-score span {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900;
      font-size: 36px;
    }

    .game-over-instruction {
      font-size: 16px;
      color: #9fa6ff;
      animation: pulse 2s ease-in-out infinite;
      font-weight: 500;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.98); }
    }

    .level-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #cbd5ff;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .level-value {
      font-weight: 700;
      font-size: 18px;
      color: #4facfe;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="game" width="320" height="620"></canvas>
      
      <div id="game-over-overlay" class="game-over-overlay">
        <div class="game-over-content">
          <div class="game-over-title">GAME OVER</div>
          <div class="game-over-score">Score: <span id="final-score">0</span></div>
          <div class="game-over-instruction">Press any key or tap a control to restart</div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div>
        <div class="title">TETRIS</div>
        <div class="tagline">Reimagined</div>
      </div>

      <div class="panel">
        <div class="panel-label">Score</div>
        <div id="score" class="score-value">0</div>
        <div class="level-indicator">
          <span>Lines Cleared</span>
          <span id="lines" class="level-value">0</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-label">Next Piece</div>
        <div class="next-canvas-wrapper">
          <canvas id="next-piece" width="120" height="120"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="panel-label">Controls</div>
        <div class="controls">
          <!-- added data-action attributes for click/tap handling -->
          <div class="control-item" data-action="left">
            <span class="key-icon">←</span> Move Left
          </div>
          <div class="control-item" data-action="right">
            <span class="key-icon">→</span> Move Right
          </div>
          <div class="control-item" data-action="down">
            <span class="key-icon">↓</span> Soft Drop
          </div>
          <div class="control-item" data-action="rotate">
            <span class="key-icon">↑</span> Rotate
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  // --- COLORS ---
  const Colors = {
    darkGrey: "rgb(20,20,30)",
    green: "#10b981",
    red: "#ef4444",
    orange: "#f59e0b",
    yellow: "#fbbf24",
    purple: "#a855f7",
    cyan: "#06b6d4",
    blue: "#3b82f6",
    darkBlue: "rgb(30,30,50)",
    white: "#ffffff",

    getCellColors() {
      return [
        this.darkGrey,
        this.green,
        this.red,
        this.orange,
        this.yellow,
        this.purple,
        this.cyan,
        this.blue,
      ];
    },
  };

  // --- SETUP ---
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const nextCanvas = document.getElementById("next-piece");
  const nextCtx = nextCanvas.getContext("2d");

  const scoreSpan = document.getElementById("score");
  const linesSpan = document.getElementById("lines");
  const finalScoreSpan = document.getElementById("final-score");
  const gameOverOverlay = document.getElementById("game-over-overlay");

  // --- Position class ---
  class Position {
    constructor(row, column) {
      this.row = row;
      this.column = column;
    }
  }

  // --- Block base class ---
  class Block {
    constructor(id) {
      this.id = id;
      this.cells = {};
      this.cellSize = 30;
      this.rowOffset = 0;
      this.columnOffset = 0;
      this.rotationState = 0;
      this.colors = Colors.getCellColors();
    }

    move(rows, columns) {
      this.rowOffset += rows;
      this.columnOffset += columns;
    }

    getCellPositions() {
      const tiles = this.cells[this.rotationState];
      const movedTiles = [];
      for (const position of tiles) {
        movedTiles.push(
          new Position(
            position.row + this.rowOffset,
            position.column + this.columnOffset
          )
        );
      }
      return movedTiles;
    }

    rotate() {
      this.rotationState += 1;
      if (this.rotationState === Object.keys(this.cells).length) {
        this.rotationState = 0;
      }
    }

    undoRotation() {
      this.rotationState -= 1;
      if (this.rotationState === -1) {
        this.rotationState = Object.keys(this.cells).length - 1;
      }
    }

    draw(ctx, offsetX, offsetY) {
      const tiles = this.getCellPositions();
      for (const tile of tiles) {
        const x = offsetX + tile.column * this.cellSize;
        const y = offsetY + tile.row * this.cellSize;
        
        // Main cell color
        ctx.fillStyle = this.colors[this.id];
        ctx.fillRect(x + 1, y + 1, this.cellSize - 2, this.cellSize - 2);
        
        // Gradient overlay for depth
        const gradient = ctx.createLinearGradient(x, y, x + this.cellSize, y + this.cellSize);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
        ctx.fillStyle = gradient;
        ctx.fillRect(x + 1, y + 1, this.cellSize - 2, this.cellSize - 2);
        
        // Border highlight
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 1.5, y + 1.5, this.cellSize - 3, this.cellSize - 3);
      }
    }
  }

  // --- Block types ---
  class LBlock extends Block {
    constructor() {
      super(1);
      this.cells = {
        0: [new Position(0, 2), new Position(1, 0), new Position(1, 1), new Position(1, 2)],
        1: [new Position(0, 1), new Position(1, 1), new Position(2, 1), new Position(2, 2)],
        2: [new Position(1, 0), new Position(1, 1), new Position(1, 2), new Position(2, 0)],
        3: [new Position(0, 0), new Position(0, 1), new Position(1, 1), new Position(2, 1)],
      };
      this.move(0, 3);
    }
  }

  class JBlock extends Block {
    constructor() {
      super(2);
      this.cells = {
        0: [new Position(0, 0), new Position(1, 0), new Position(1, 1), new Position(1, 2)],
        1: [new Position(0, 1), new Position(0, 2), new Position(1, 1), new Position(2, 1)],
        2: [new Position(1, 0), new Position(1, 1), new Position(1, 2), new Position(2, 2)],
        3: [new Position(0, 1), new Position(1, 1), new Position(2, 0), new Position(2, 1)],
      };
      this.move(0, 3);
    }
  }

  class IBlock extends Block {
    constructor() {
      super(3);
      this.cells = {
        0: [new Position(1, 0), new Position(1, 1), new Position(1, 2), new Position(1, 3)],
        1: [new Position(0, 2), new Position(1, 2), new Position(2, 2), new Position(3, 2)],
        2: [new Position(2, 0), new Position(2, 1), new Position(2, 2), new Position(2, 3)],
        3: [new Position(0, 1), new Position(1, 1), new Position(2, 1), new Position(3, 1)],
      };
      this.move(-1, 3);
    }
  }

  class OBlock extends Block {
    constructor() {
      super(4);
      this.cells = {
        0: [new Position(0, 0), new Position(0, 1), new Position(1, 0), new Position(1, 1)],
      };
      this.move(0, 4);
    }
  }

  class SBlock extends Block {
    constructor() {
      super(5);
      this.cells = {
        0: [new Position(0, 1), new Position(0, 2), new Position(1, 0), new Position(1, 1)],
        1: [new Position(0, 1), new Position(1, 1), new Position(1, 2), new Position(2, 2)],
        2: [new Position(1, 1), new Position(1, 2), new Position(2, 0), new Position(2, 1)],
        3: [new Position(0, 0), new Position(1, 0), new Position(1, 1), new Position(2, 1)],
      };
      this.move(0, 3);
    }
  }

  class TBlock extends Block {
    constructor() {
      super(6);
      this.cells = {
        0: [new Position(0, 1), new Position(1, 0), new Position(1, 1), new Position(1, 2)],
        1: [new Position(0, 1), new Position(1, 1), new Position(1, 2), new Position(2, 1)],
        2: [new Position(1, 0), new Position(1, 1), new Position(1, 2), new Position(2, 1)],
        3: [new Position(0, 1), new Position(1, 0), new Position(1, 1), new Position(2, 1)],
      };
      this.move(0, 3);
    }
  }

  class ZBlock extends Block {
    constructor() {
      super(7);
      this.cells = {
        0: [new Position(0, 0), new Position(0, 1), new Position(1, 1), new Position(1, 2)],
        1: [new Position(0, 2), new Position(1, 1), new Position(1, 2), new Position(2, 1)],
        2: [new Position(1, 0), new Position(1, 1), new Position(2, 1), new Position(2, 2)],
        3: [new Position(0, 1), new Position(1, 0), new Position(1, 1), new Position(2, 0)],
      };
      this.move(0, 3);
    }
  }

  // --- Grid class ---
  class Grid {
    constructor() {
      this.numRows = 20;
      this.numCols = 10;
      this.cellSize = 30;
      this.grid = [];
      this.colors = Colors.getCellColors();

      for (let i = 0; i < this.numRows; i++) {
        const row = [];
        for (let j = 0; j < this.numCols; j++) {
          row.push(0);
        }
        this.grid.push(row);
      }
    }

    isInside(row, column) {
      return row >= 0 && row < this.numRows && column >= 0 && column < this.numCols;
    }

    isEmpty(row, column) {
      return this.grid[row][column] === 0;
    }

    isRowFull(row) {
      for (let column = 0; column < this.numCols; column++) {
        if (this.grid[row][column] === 0) return false;
      }
      return true;
    }

    clearRow(row) {
      for (let column = 0; column < this.numCols; column++) {
        this.grid[row][column] = 0;
      }
    }

    moveRowDown(row, numRows) {
      for (let column = 0; column < this.numCols; column++) {
        this.grid[row + numRows][column] = this.grid[row][column];
        this.grid[row][column] = 0;
      }
    }

    clearFullRows() {
      let completed = 0;
      for (let row = this.numRows - 1; row >= 0; row--) {
        if (this.isRowFull(row)) {
          this.clearRow(row);
          completed += 1;
        } else if (completed > 0) {
          this.moveRowDown(row, completed);
        }
      }
      return completed;
    }

    reset() {
      for (let row = 0; row < this.numRows; row++) {
        for (let column = 0; column < this.numCols; column++) {
          this.grid[row][column] = 0;
        }
      }
    }

    draw(ctx) {
      for (let row = 0; row < this.numRows; row++) {
        for (let column = 0; column < this.numCols; column++) {
          const cellValue = this.grid[row][column];
          const x = column * this.cellSize + 10;
          const y = row * this.cellSize + 10;
          
          // Main cell
          ctx.fillStyle = this.colors[cellValue];
          ctx.fillRect(x + 1, y + 1, this.cellSize - 2, this.cellSize - 2);
          
          // Add gradient to locked blocks
          if (cellValue !== 0) {
            const gradient = ctx.createLinearGradient(x, y, x + this.cellSize, y + this.cellSize);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
            ctx.fillStyle = gradient;
            ctx.fillRect(x + 1, y + 1, this.cellSize - 2, this.cellSize - 2);
            
            // Border
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 1.5, y + 1.5, this.cellSize - 3, this.cellSize - 3);
          }
        }
      }
    }
  }

  // --- Game class ---
  class Game {
    constructor() {
      this.grid = new Grid();
      this.blocks = this.createBlockBag();
      this.currentBlock = this.getRandomBlock();
      this.nextBlock = this.getRandomBlock();
      this.gameOver = false;
      this.score = 0;
      this.linesCleared = 0;
    }

    createBlockBag() {
      return [
        new IBlock(),
        new JBlock(),
        new LBlock(),
        new OBlock(),
        new SBlock(),
        new TBlock(),
        new ZBlock(),
      ];
    }

    updateScore(linesCleared, moveDownPoints) {
      if (linesCleared === 1) {
        this.score += 100;
      } else if (linesCleared === 2) {
        this.score += 300;
      } else if (linesCleared === 3) {
        this.score += 500;
      } else if (linesCleared === 4) {
        this.score += 800;
      }
      this.score += moveDownPoints;
      this.linesCleared += linesCleared;
    }

    getRandomBlock() {
      if (this.blocks.length === 0) {
        this.blocks = this.createBlockBag();
      }
      const index = Math.floor(Math.random() * this.blocks.length);
      const block = this.blocks[index];
      this.blocks.splice(index, 1);
      return block;
    }

    moveLeft() {
      this.currentBlock.move(0, -1);
      if (!this.blockInside() || !this.blockFits()) {
        this.currentBlock.move(0, 1);
      }
    }

    moveRight() {
      this.currentBlock.move(0, 1);
      if (!this.blockInside() || !this.blockFits()) {
        this.currentBlock.move(0, -1);
      }
    }

    moveDown() {
      this.currentBlock.move(1, 0);
      if (!this.blockInside() || !this.blockFits()) {
        this.currentBlock.move(-1, 0);
        this.lockBlock();
      }
    }

    lockBlock() {
      const tiles = this.currentBlock.getCellPositions();
      for (const position of tiles) {
        if (this.grid.isInside(position.row, position.column)) {
          this.grid.grid[position.row][position.column] = this.currentBlock.id;
        }
      }

      this.currentBlock = this.nextBlock;
      this.nextBlock = this.getRandomBlock();

      const rowsCleared = this.grid.clearFullRows();
      if (rowsCleared > 0) {
        this.updateScore(rowsCleared, 0);
      }

      if (!this.blockFits()) {
        this.gameOver = true;
      }
    }

    reset() {
      this.grid.reset();
      this.blocks = this.createBlockBag();
      this.currentBlock = this.getRandomBlock();
      this.nextBlock = this.getRandomBlock();
      this.score = 0;
      this.linesCleared = 0;
      this.gameOver = false;
    }

    blockFits() {
      const tiles = this.currentBlock.getCellPositions();
      for (const tile of tiles) {
        if (!this.grid.isInside(tile.row, tile.column)) return false;
        if (!this.grid.isEmpty(tile.row, tile.column)) return false;
      }
      return true;
    }

    rotate() {
      this.currentBlock.rotate();
      if (!this.blockInside() || !this.blockFits()) {
        this.currentBlock.undoRotation();
      }
    }

    blockInside() {
      const tiles = this.currentBlock.getCellPositions();
      for (const tile of tiles) {
        if (!this.grid.isInside(tile.row, tile.column)) return false;
      }
      return true;
    }

    drawMainPlayfield(ctx) {
      this.grid.draw(ctx);
      this.currentBlock.draw(ctx, 10, 10);
    }

    drawNextBlock(ctx) {
      ctx.fillStyle = Colors.darkGrey;
      ctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

      const tempBlock = Object.create(Object.getPrototypeOf(this.nextBlock));
      Object.assign(tempBlock, this.nextBlock);
      tempBlock.rowOffset = 0;
      tempBlock.columnOffset = 0;

      let offsetX, offsetY;
      if (this.nextBlock.id === 3) {
        // I piece: 4 cells * 30px = 120px wide; start at x=0 so it fits fully
        offsetX = 0;
        offsetY = 15;
      } else if (this.nextBlock.id === 4) {
        offsetX = 30;
        offsetY = 30;
      } else {
        offsetX = 15;
        offsetY = 30;
      }

      tempBlock.draw(ctx, offsetX, offsetY);
    }
  }

  const game = new Game();

  // --- Unified action handler for keyboard + clicks ---
  function handleAction(action) {
    if (game.gameOver) {
      // Restart game on any action when over
      game.reset();
      return;
    }

    if (action === "left") {
      game.moveLeft();
    } else if (action === "right") {
      game.moveRight();
    } else if (action === "down") {
      game.moveDown();
      game.updateScore(0, 1); // soft drop bonus
    } else if (action === "rotate") {
      game.rotate();
    }
  }

  // --- Keyboard input ---
  document.addEventListener("keydown", (event) => {
    switch (event.key) {
      case "ArrowLeft":
        event.preventDefault();
        handleAction("left");
        break;
      case "ArrowRight":
        event.preventDefault();
        handleAction("right");
        break;
      case "ArrowDown":
        event.preventDefault();
        handleAction("down");
        break;
      case "ArrowUp":
        event.preventDefault();
        handleAction("rotate");
        break;
      default:
        // Any other key also restarts if game over
        if (game.gameOver) {
          game.reset();
        }
    }
  });

  // --- Click / tap input on sidebar controls ---
  document.querySelectorAll(".control-item").forEach((item) => {
    const action = item.getAttribute("data-action");
    item.addEventListener("click", (e) => {
      e.preventDefault();
      handleAction(action);
    });
  });

  // Optional: tap overlay to restart
  gameOverOverlay.addEventListener("click", () => {
    if (game.gameOver) {
      game.reset();
    }
  });

  // --- Auto drop ---
  setInterval(() => {
    if (!game.gameOver) {
      game.moveDown();
    }
  }, 500);

  // --- Main render loop ---
  function render() {
    ctx.fillStyle = Colors.darkBlue;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    game.drawMainPlayfield(ctx);

    scoreSpan.textContent = game.score;
    linesSpan.textContent = game.linesCleared;
    game.drawNextBlock(nextCtx);

    if (game.gameOver) {
      gameOverOverlay.classList.add("visible");
      finalScoreSpan.textContent = game.score;
    } else {
      gameOverOverlay.classList.remove("visible");
    }

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
