function drawCell(x, y, id) { ctx.drawImage(SPR[10][id], x, y); }

function drawPlayfield() {
  ctx.drawImage(panelBg(COLS * CELL, ROWS * CELL), PF_X, PF_Y, COLS * CELL, ROWS * CELL);
  drawStars(pfStars, PF_X, PF_Y, "#8fd0ff");
  if (paused) return;

  if (dropFx) {                               // halftone streak left by a hard drop
    ctx.globalAlpha = 0.9 * (1 - dropFx.t / 350);
    ctx.drawImage(trailCanvas, PF_X, PF_Y);
    ctx.globalAlpha = 1;
  }

  const flashOn =reduced() || Math.floor(phaseT / 60) % 2 === 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = board[r][c];
      if (!v) continue;
      const id = phase === "clear" && clearRows.includes(r) && flashOn ? 9 : v;
      drawCell(PF_X + c * CELL, PF_Y + r * CELL, id);
    }
  }

  if (phase === "fall") {                     // cascade: blocks dropping into the gaps
    for (const f of fallCells) {
      const d = f.to - f.from, p = Math.min(1, phaseT / (FALL_BASE + FALL_PER * d));
      drawCell(PF_X + f.c * CELL, PF_Y + Math.round((f.from + d * p * p) * CELL), f.id);
    }
  }
  if (lockFx) {                               // landing flash
    ctx.globalAlpha = 0.75 * (1 - lockFx.t / 140);
    for (const [r, c] of lockFx.cells) drawCell(PF_X + c * CELL, PF_Y + r * CELL, 9);
    ctx.globalAlpha = 1;
  }

  if (phase === "play" && cur) {
    const g = ghostRow();
    if (cfg.ghost && g !== cur.row) {
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = PIECE_COLORS[cur.id];
      for (const [dr, dc] of SHAPES[cur.id].cells[cur.rot]) {
        const r = g + dr;
        if (r < 0) continue;
        const x = PF_X + (cur.col + dc) * CELL, y = PF_Y + r * CELL;
        ctx.fillRect(x + 1, y + 1, 8, 1); ctx.fillRect(x + 1, y + 8, 8, 1);
        ctx.fillRect(x + 1, y + 1, 1, 8); ctx.fillRect(x + 8, y + 1, 1, 8);
      }
      ctx.globalAlpha = 1;
    }
    for (const [dr, dc] of SHAPES[cur.id].cells[cur.rot]) {
      const r = cur.row + dr;
      if (r < 0) continue;
      drawCell(PF_X + (cur.col + dc) * CELL, PF_Y + r * CELL, cur.id);
    }
  }

  if (phase === "clear") drawClearFx();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    rect(Math.round(p.x), Math.round(p.y), p.size, p.size, p.color);
  }
  ctx.globalAlpha = 1;

  if (phase === "over") {
    const n = Math.min(ROWS, Math.floor(phaseT / 35));
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < COLS; c++) drawCell(PF_X + c * CELL, PF_Y + (ROWS - 1 - i) * CELL, 8);
    }
  }
}

// white sweep across the rows being cleared, with the name of the clear in a banner on top
function drawClearFx() {
  const w = COLS * CELL, p = phaseT / 320;
  const grow = reduced() ? 1 : Math.min(1, phaseT / 100);
  const bw = Math.round(w * grow);
  ctx.globalAlpha = Math.min(1, (1 - p) * 1.6);
  for (const r of clearRows) rect(PF_X + Math.round((w - bw) / 2), PF_Y + r * CELL, bw, CELL, "#eaf6ff");

  const mid = (clearRows[0] + clearRows[clearRows.length - 1]) / 2;
  const h = 14;
  const y = Math.max(PF_Y, Math.min(PF_Y + ROWS * CELL - h, Math.round(PF_Y + mid * CELL + CELL / 2 - h / 2)));
  ctx.font = `8px ${FONT}`;
  const bw2 = Math.ceil(ctx.measureText(clearLabel).width) + 10, bx = PF_X + Math.round((w - bw2) / 2);
  ctx.globalAlpha = Math.min(1, (1 - p) * 4) * 0.94;
  rect(bx, y, bw2, h, "#060c34");
  rect(bx, y, bw2, 1, "#7aa0ff"); rect(bx, y + h - 1, bw2, 1, "#7aa0ff");
  ctx.globalAlpha = Math.min(1, (1 - p) * 4);
  const color = clearLabel === "QUAD!" ? "#ffd860" : clearLabel === "T-SPIN" ? "#c89cff"
    : clearLabel.startsWith("CHAIN") ? "#ff9ad0" : "#5cf0e0";
  text(clearLabel, PF_X + w / 2, y + 3, color, "center");
  ctx.globalAlpha = 1;
}

// "COMBO n" tag that slides in from the left over the top of the playfield
function drawComboFx() {
  if (!comboFx) return;
  const t = comboFx.t, IN = 160, OUT = 220, TOTAL = 1400;
  let k = 1;
  if (t < IN) k = 1 - Math.pow(1 - t / IN, 2);
  else if (t > TOTAL - OUT) k = Math.max(0, 1 - (t - (TOTAL - OUT)) / OUT);
  const num = String(comboFx.n);
  const w = 58 + num.length * 12, h = 20;
  const x = Math.round(PF_X + 2 - w + (w + 2) * k), y = PF_Y + 8;
  rect(x, y, w, h, "#14286e");
  rect(x, y, w, 1, "#8aa8ff"); rect(x, y, 1, h, "#8aa8ff");
  rect(x, y + h - 1, w, 1, "#0c1a5a"); rect(x + w - 1, y, 1, h, "#0c1a5a");
  text("COMBO", x + 6, y + 6, "#ffd860", "left");
  text(num, x + 52, y + 4, "#ffffff", "left", 12);
}

function overlayPanel(y, h) {
  const x = PF_X + 4, w = COLS * CELL - 8;
  ctx.globalAlpha = 0.92;
  rect(x, y, w, h, "#060c34");
  ctx.globalAlpha = 1;
  frame(x, y, w, h, "#7aa0ff");
  frame(x + 1, y + 1, w - 2, h - 2, "#1c3290");
}

function drawGame() {
  const cx = PF_X + (COLS * CELL) / 2;
  ctx.save();
  if (shakeT > 0) ctx.translate(0, 1);

  // frame (full-height pillars beside the board, or just board-high ones in the tall layout)
  if (layout === "tall") {
    drawPillar(PF_X - 8, PF_Y - 6, ROWS * CELL + 12);
    drawPillar(PF_X + COLS * CELL, PF_Y - 6, ROWS * CELL + 12);
  } else {
    drawPillar(PF_X - 8);
    drawPillar(PF_X + COLS * CELL);
  }
  rect(PF_X, PF_Y - 6, COLS * CELL, 6, "#2448b8");
  rect(PF_X, PF_Y - 6, COLS * CELL, 1, "#5a86ff");
  rect(PF_X, PF_Y - 1, COLS * CELL, 1, "#0a1450");
  rect(PF_X, PF_Y + ROWS * CELL, COLS * CELL, 6, "#2448b8");
  rect(PF_X, PF_Y + ROWS * CELL, COLS * CELL, 1, "#0a1450");
  rect(PF_X, PF_Y + ROWS * CELL + 5, COLS * CELL, 1, "#0a1450");
  drawPlayfield();
  ctx.restore();

  if (layout === "tall") drawHudTall(cx); else drawHudWide();

  // ---- overlays on the playfield (positions are relative to the board, so they work in both layouts)
  const oy = PF_Y - 12;
  if (paused) {
    overlayPanel(72 + oy, 80);
    if (blink(500)) text("PAUSE", cx, 82 + oy, "#ffd860", "center");
    drawMenu(menus.pause, cx, 104 + oy, 14);
  } else if (phase === "ready") {
    if (phaseT < 800) { if (blink(160)) text("READY", cx, 100 + oy, "#ffd860", "center"); }
    else text("GO!", cx, 100 + oy, "#5cf08c", "center");
  } else if (phase === "over" && phaseT >= OVER_MENU_DELAY) {
    const extra = (newBest ? 12 : 0) + (Board.overMsg ? 12 : 0);
    overlayPanel(56 + oy, 112 + extra);
    const [t1, t2, c] = !finished ? ["GAME", "OVER", "#ff6a80"]
      : mode === "sprint" ? ["FINISH!", fmtTime(gameMs), "#5cf08c"]
      : ["TIME UP!", String(score), "#5cf08c"];
    text(t1, cx, 66 + oy, c, "center");
    text(t2, cx, 78 + oy, mode === "marathon" || !finished ? c : "#ffffff", "center");
    let y = 96 + oy;
    if (newBest) { if (blink(250)) text("NEW BEST", cx, y, "#ffd860", "center"); y += 12; }
    if (Board.overMsg) { text(Board.overMsg, cx, y, "#5cf0e0", "center"); y += 12; }
    drawMenu(menus.over, cx, y + 2, 14);
  }
  if (!paused) drawComboFx();
}

// the stat under HOLD: best score in marathon, the clock in timed modes
function hudStat() {
  if (mode === "sprint") return ["TIME", fmtTime(gameMs)];
  if (mode === "ultra") return ["LEFT", fmtTime(Math.max(0, ULTRA_MS - gameMs))];
  return ["BEST", String(Math.max(hi, score))];
}

// side panels: hold + best + score messages on the left, next queue + stats on the right
function drawHudWide() {
  // ---- left panel
  text("HOLD", 8, 8, "#9ec0ff");
  drawBox(6, 18, 58, 40);
  drawPreview(hold, 35, 38, 10, holdUsed ? 0.4 : 1);
  dottedLine(6, 66, 58);
  const [hl, hv] = hudStat();
  text(hl, 8, 74, "#9ec0ff");
  text(hv, 63, 86, "#ffffff", "right");
  dottedLine(6, 100, 58);

  if (msg && !paused) {
    msg.lines.forEach((line, i) => {
      const color = line.startsWith("+") ? "#ffffff"
        : line.startsWith("COMBO") ? "#ff9ad0"
        : line === "B2B" || line === "PERFECT" ? "#5cf0e0" : "#ffd860";
      text(line, 35, 108 + i * 12, color, "center");
    });
    if (msg.lvUp && blink(150)) text("LV UP!", 35, 112 + msg.lines.length * 12, "#5cf08c", "center");
  }
  if (toast) { text("SOUND", 35, 194, "#9ec0ff", "center"); text(Sound.label(), 35, 206, "#ffd860", "center"); }
  else if (!isTouch) text("P:PAUSE", 35, 206, "#3a4c98", "center", 8, null);

  // ---- right panel
  const RX = 192;
  text("NEXT", RX + 2, 8, "#9ec0ff");
  drawBox(RX, 18, 58, 36);
  drawBox(RX, 58, 58, 50);
  if (!paused) {
    drawPreview(queue[0], RX + 29, 36, 10);
    drawPreview(queue[1], RX + 29, 71, 6);
    drawPreview(queue[2], RX + 29, 95, 6);
  }
  dottedLine(RX, 116, 58);
  text("LINES", RX + 2, 124, "#9ec0ff");
  text(mode === "sprint" ? lines + "/" + SPRINT_LINES : String(lines), RX + 57, 136, "#ffffff", "right");
  text("LEVEL", RX + 2, 152, "#9ec0ff");
  text(String(level), RX + 57, 164, "#ffffff", "right");
  text("SCORE", RX + 2, 180, "#9ec0ff");
  text(String(shownScore), RX + 57, 192, "#ffffff", "right");
}

// everything in one strip above the board (phones held upright): hold, stats, next queue
function drawHudTall(cx) {
  text("HOLD", 4, 4, "#9ec0ff");
  drawBox(4, 14, 40, 42);
  drawPreview(hold, 24, 35, 6, holdUsed ? 0.4 : 1);

  text("NEXT", 116, 4, "#9ec0ff");
  drawBox(116, 14, 40, 42);
  if (!paused) {
    drawPreview(queue[0], 136, 23, 6);
    drawPreview(queue[1], 136, 35, 6);
    drawPreview(queue[2], 136, 47, 6);
  }

  text("SCORE", 80, 3, "#9ec0ff", "center");
  text(String(shownScore), 80, 13, "#ffffff", "center");
  text("LV " + level, 80, 26, "#9ec0ff", "center");
  text("LN " + (mode === "sprint" ? lines + "/" + SPRINT_LINES : lines), 80, 36, "#9ec0ff", "center");
  const [hl, hv] = hudStat();
  text((hl === "BEST" ? "HI" : hl === "TIME" ? "" : hl) + " " + hv, 80, 46, "#6a80d0", "center");

  // points and bonuses of the last clear, over the top of the board (the clear banner and
  // combo tag already name the clear itself)
  if (msg && !paused) {
    const rows = msg.lines.filter(l => l.startsWith("+") || l === "B2B" || l === "PERFECT");
    rows.forEach((line, i) => {
      text(line, cx, PF_Y + 34 + i * 11, line.startsWith("+") ? "#ffffff" : "#5cf0e0", "center");
    });
    if (msg.lvUp && blink(150)) text("LV UP!", cx, PF_Y + 34 + rows.length * 11, "#5cf08c", "center");
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
function render() {
  hits = [];
  rect(0, 0, W, H, "#000");
  if (scene === "game") { drawGame(); return; }
  drawStars(titleStars, 0, 0, "#7fd0ff");
  drawScreenFrame();
  extraH = H - LAYOUTS.wide.H;
  ctx.save();
  if (scene !== "title") ctx.translate(0, Math.round(extraH / 2));
  if (scene === "title") drawTitle();
  else if (scene === "settings") drawSettings();
  else if (scene === "keys") drawKeys();
  else if (scene === "controls") drawInfoScreen("CONTROLS", isTouch ? TOUCH_CONTROLS : controlRows(), true);
  else if (scene === "scoring") drawInfoScreen("SCORING", SCORING, true, 12, 30);
  else if (scene === "credits") drawInfoScreen("CREDITS", CREDITS, false);
  else if (scene === "board") drawBoard();
  else if (scene === "name") drawNameEntry();
  else if (scene === "install") drawInfoScreen("INSTALL APP", INSTALL_HELP, false, 14, 36);
  ctx.restore();
}
let extraH = 0;                           // how much taller than 224 a menu screen is drawn
// draws part of the title screen pushed down by a share of the extra height
function band(share, fn) {
  ctx.save(); ctx.translate(0, Math.round(extraH * share)); fn(); ctx.restore();
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(50, t - last);
  last = t;
  now = t;
  // never let one bad frame stop the game: log it and keep the loop running
  try {
    update(dt);
    render();
    syncPad();
  } catch (err) {
    console.error(err);
    if (!Number.isFinite(score)) { score = 0; shownScore = 0; }
  }
  requestAnimationFrame(loop);
}

resize();
if (document.fonts) document.fonts.load(`8px ${FONT}`).then(resize, () => {});
requestAnimationFrame(loop);

// offline support + "install app" (needs http/https, so it is skipped for file:// previews)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
